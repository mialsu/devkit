version: "0.2"
name: crew
summary: >
  The Owner's five-seat team for any repository: an architect who shapes goals into slices and
  reports, a builder who delivers one slice at a time end to end, a QA seat that verifies each
  candidate the way a user hits it, a Codex reviewer that reviews each candidate's commits from
  its own worktree, and a junior that takes narrow jobs from the others in a worktree of its own.
  Launch it per project with crew-up.sh, which names the rig crew-<project>, makes each cwd
  absolute (the repository, .crew/review for the reviewer, .crew/junior for the junior) and picks
  the junior's runtime.
culture_file: CULTURE.md

# Claude seats launch with --permission-mode auto, so the Owner is not answering a prompt per command;
# Codex has no auto mode and stays at the floor. Hard limits still come from the project's AGENTS.md.
permission_policy: builtin:auto

# The Claude seats pin their model per member (model: under runtime), so a fresh crew doesn't take
# whatever the runtime defaults to. The Codex reviewer keeps Codex's own default.

# Keep OpenRig's instruction blocks out of the project's tracked CLAUDE.md.
managed_blocks:
  claude-code: CLAUDE.local.md

pods:
  - id: orch
    label: Lead
    members:
      - id: architect
        agent_ref: "local:agents/architect"
        profile: default
        runtime: claude-code
        model: claude-opus-5-5
        cwd: "."

  - id: dev
    label: Build and verify
    members:
      - id: builder
        agent_ref: "local:agents/builder"
        profile: default
        runtime: claude-code
        model: claude-opus-5-5
        cwd: "."
      - id: qa
        agent_ref: "local:agents/qa"
        profile: default
        runtime: claude-code
        model: claude-opus-5-5
        cwd: "."
      # Codex writes OpenRig's blocks into AGENTS.md (managed_blocks takes only claude-code), so the
      # reviewer runs in its own worktree, where that AGENTS.md is never committed from.
      - id: reviewer
        agent_ref: "local:agents/reviewer"
        profile: default
        runtime: codex
        cwd: ".crew/review"
      # File tools only, no shell, in its own worktree. crew-up keeps this Pi form on a machine with
      # a local model (local-llm --check) and switches it to Claude Code on Haiku everywhere else.
      - id: junior
        agent_ref: "local:agents/junior"
        profile: default
        runtime: pi
        model: ollama/local
        cwd: ".crew/junior"
    edges:
      - kind: delegates_to
        from: builder
        to: qa
      - kind: delegates_to
        from: builder
        to: junior
      - kind: delegates_to
        from: qa
        to: junior

edges:
  - kind: delegates_to
    from: orch.architect
    to: dev.builder
  - kind: delegates_to
    from: orch.architect
    to: dev.qa
  - kind: delegates_to
    from: orch.architect
    to: dev.reviewer
  - kind: delegates_to
    from: orch.architect
    to: dev.junior
  - kind: escalates_to
    from: dev.builder
    to: orch.architect
  - kind: escalates_to
    from: dev.qa
    to: orch.architect
  - kind: escalates_to
    from: dev.reviewer
    to: orch.architect
