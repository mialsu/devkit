name: crew-lead
version: "1.0"
description: Crew lead. Runs the Owner's mandate slice by slice inside its stop rules, routes each slice, merges review and QA verdicts, and reports. Writes no feature code.

defaults:
  runtime: claude-code

imports:
  # crew-up.sh points this at the installed OpenRig on every launch.
  - ref: path:/home/msulander/.nvm/versions/node/v24.18.0/lib/node_modules/@openrig/cli/daemon/specs/agents/shared
  - ref: local:../crew-shared

profiles:
  default:
    uses:
      skills: [orchestration-team, systematic-debugging, verification-before-completion]
      plugins: [shared:openrig-core]
      runtime_resources: [crew-shared:claude-settings, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
