version: "0.2"
name: crew
summary: >
  The Owner's five-seat team for any repository: a lead who runs the Owner's mandate slice by slice and
  reports, a builder who delivers one slice at a time end to end, a QA seat that verifies each
  candidate the way a user hits it, a Codex reviewer that reviews each candidate's commits from
  its own worktree, and a junior that takes narrow jobs from the others in a worktree of its own.
  Launch it per project with crew-up.sh, which names the rig crew-<project>, makes each cwd
  absolute (the repository, .crew/review for the reviewer, .crew/junior for the junior).
culture_file: CULTURE.md

# Claude seats launch with --permission-mode auto, so the Owner is not answering a prompt per command;
# Codex has no auto mode and stays at the floor. Hard limits still come from the project's AGENTS.md.
permission_policy: builtin:auto

# The Claude seats pin their model per member (model: under runtime), so a fresh crew doesn't take
# whatever the runtime defaults to. The Codex reviewer keeps Codex's own default.

# Keep OpenRig's instruction blocks out of the project's tracked CLAUDE.md.
managed_blocks:
  claude-code: CLAUDE.local.md

pods:
  - id: orch
    label: Lead
    members:
      - id: lead
        agent_ref: "local:agents/lead"
        profile: default
        runtime: claude-code
        model: claude-opus-5-5
        cwd: "."
        # gh keeps its token in the desktop keyring, reached over the session D-Bus. OpenRig gives
        # every seat DBUS_SESSION_BUS_ADDRESS=disabled: (rig-spec, "The runtime directory, on
        # Linux"), so gh in a seat finds no token and reports it invalid. The lead opens the
        # slice's PR, so it alone gets the bus. It can read the whole keyring, not only gh's token.
        # The path assumes uid 1000.
        env:
          DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/1000/bus"

  - id: dev
    label: Build and verify
    members:
      - id: builder
        agent_ref: "local:agents/builder"
        profile: default
        runtime: claude-code
        model: claude-opus-5-5
        cwd: "."
      - id: qa
        agent_ref: "local:agents/qa"
        profile: default
        runtime: claude-code
        model: claude-opus-5-5
        cwd: "."
      # Codex writes OpenRig's blocks into AGENTS.md (managed_blocks takes only claude-code), so the
      # reviewer runs in its own worktree, where that AGENTS.md is never committed from.
      - id: reviewer
        agent_ref: "local:agents/reviewer"
        profile: default
        runtime: codex
        cwd: ".crew/review"
      # File tools only, no shell, in its own worktree: Claude Code on Haiku, the cheapest Claude.
      - id: junior
        agent_ref: "local:agents/junior"
        profile: default
        runtime: claude-code
        model: claude-haiku-5-5
        cwd: ".crew/junior"
    edges:
      - kind: delegates_to
        from: builder
        to: qa
      - kind: delegates_to
        from: builder
        to: junior
      - kind: delegates_to
        from: qa
        to: junior

edges:
  - kind: delegates_to
    from: orch.lead
    to: dev.builder
  - kind: delegates_to
    from: orch.lead
    to: dev.qa
  - kind: delegates_to
    from: orch.lead
    to: dev.reviewer
  - kind: delegates_to
    from: orch.lead
    to: dev.junior
  - kind: escalates_to
    from: dev.builder
    to: orch.lead
  - kind: escalates_to
    from: dev.qa
    to: orch.lead
  - kind: escalates_to
    from: dev.reviewer
    to: orch.lead
