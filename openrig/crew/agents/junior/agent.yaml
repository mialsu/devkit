name: crew-junior
version: "1.0"
description: >
  A small, cheap seat that takes narrow jobs from the other seats: one function and its test, a
  whole-file rewrite, a docs draft, a summary, a search. It has file tools only, no shell, and works
  in its own worktree. It runs on Claude Code with Haiku.

defaults:
  runtime: claude-code

imports:
  # crew-up.sh points this at the installed OpenRig on every launch.
  - ref: path:/home/msulander/.nvm/versions/node/v24.18.0/lib/node_modules/@openrig/cli/daemon/specs/agents/shared

profiles:
  default:
    uses:
      # Denies Bash, the web and subagents, so the seat has file tools only.
      runtime_resources: [claude-settings]

resources:
  guidance:
    - id: role
      path: guidance/role.md
  runtime_resources:
    - id: claude-settings
      path: runtime/claude-settings.fragment.json
      runtime: claude-code
      type: claude_settings_fragment

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
